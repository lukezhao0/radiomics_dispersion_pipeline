[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onc-pipeline"
version = "1.0.0"
description = "Clinical NLP/ML pipeline for breast cancer tumor dispersiveness prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["approach1*", "approach2*", "common*", "experiment_comparison*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
